name: Build Android TV APK

on:
  workflow_dispatch:
    inputs:
      kvideo_url:
        description: "Optional KVideo URL (for -PkvideoUrl)"
        required: false
        type: string
  push:
    paths:
      - "android-tv/**"
      - ".github/workflows/android-tv-apk.yml"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle execute permission
        run: chmod +x gradlew build-apk.sh

      - name: Build debug APK
        env:
          KVIDEO_URL: ${{ github.event.inputs.kvideo_url }}
        run: |
          if [ -n "$KVIDEO_URL" ]; then
            ./gradlew --no-daemon clean assembleDebug -PkvideoUrl="$KVIDEO_URL"
          else
            ./build-apk.sh
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KVideo-TV-debug-apk
          path: |
            android-tv/KVideo-TV-debug.apk
            android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
